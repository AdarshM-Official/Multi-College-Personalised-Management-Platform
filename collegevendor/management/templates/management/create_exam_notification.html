{% extends 'base.html' %}

{% block title %}Create Exam Notification{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 py-3">
                    <h4 class="mb-0 text-primary"><i class="fas fa-bell me-2"></i>Post Exam Notification</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ form.title.label }}</label>
                            {{ form.title }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ form.exam_date.label }}</label>
                            {{ form.exam_date }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ form.description.label }}</label>
                            {{ form.description }}
                        </div>
                        <div class="mt-4 text-end">
                            <a href="{% url 'dashboard' %}" class="btn btn-light me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Post Notification</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
