{% extends 'base.html' %}

{% block title %}Set New Password | {{ request.college.name }}{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card glass-card border-0 shadow-lg overflow-hidden animate__animated animate__fadeIn">
                <div class="card-header bg-primary text-white p-4 text-center border-0">
                    <div class="bg-white bg-opacity-20 d-inline-flex p-3 rounded-circle mb-3">
                        <i class="bi bi-shield-check fs-2"></i>
                    </div>
                    <h4 class="fw-bold mb-0 text-white">Set New Password</h4>
                    <p class="mb-0 opacity-75 small">Enter and confirm your new account password below.</p>
                </div>
                <div class="card-body p-4 p-lg-5 bg-white">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" name="password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" name="confirm_password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm">
                            Reset Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
