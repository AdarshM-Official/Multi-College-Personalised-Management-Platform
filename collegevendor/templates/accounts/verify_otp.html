{% extends 'base.html' %}

{% block title %}Verify OTP | {{ request.college.name }}{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card glass-card border-0 shadow-lg overflow-hidden animate__animated animate__fadeIn">
                <div class="card-header bg-primary text-white p-4 text-center border-0">
                    <div class="bg-white bg-opacity-20 d-inline-flex p-3 rounded-circle mb-3">
                        <i class="bi bi-chat-left-key fs-2"></i>
                    </div>
                    <h4 class="fw-bold mb-0 text-white">Verify OTP</h4>
                    <p class="mb-0 opacity-75 small">Enter the 6-digit code printed in Your Email for <strong>{{ email }}</strong>.</p>
                </div>
                <div class="card-body p-4 p-lg-5 bg-white">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">Verification Code</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-key-fill"></i></span>
                                <input type="text" name="otp" class="form-control bg-light border-0 py-2 text-center fw-bold fs-5" style="letter-spacing: 4px;" placeholder="123456" minlength="6" maxlength="6" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm">
                            Verify Code &rarr;
                        </button>
                    </form>
                    
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="small text-muted mb-0">Didn't find the code? <a href="{% url 'password_reset' %}" class="fw-bold text-decoration-none">Resend OTP</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
