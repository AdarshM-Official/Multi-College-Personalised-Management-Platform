{% extends 'base.html' %}

{% block title %}Reset Successful | {{ request.college.name }}{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 text-center">
            <div class="card glass-card border-0 shadow-lg p-5 bg-white">
                <div class="bg-success bg-opacity-10 d-inline-flex p-4 rounded-circle mb-4 animate__animated animate__bounceIn">
                    <i class="bi bi-check-circle-fill fs-1 text-success"></i>
                </div>
                <h3 class="fw-bold text-dark mb-3">Password Changed!</h3>
                <p class="text-muted mb-4">Your password has been reset successfully. You can now log in with your new credentials.</p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm">Login Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
