{% extends 'base.html' %}

{% block title %}Reset Sent | {{ request.college.name }}{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 text-center">
            <div class="card glass-card border-0 shadow-lg p-5 bg-white">
                <div class="bg-success bg-opacity-10 d-inline-flex p-4 rounded-circle mb-4">
                    <i class="bi bi-send-check fs-1 text-success"></i>
                </div>
                <h3 class="fw-bold text-dark mb-3">Email Sent!</h3>
                <p class="text-muted mb-4">We've sent a password reset link to your email address. Please check your inbox (and spam folder) and follow the instructions.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary px-5 py-2 rounded-pill fw-bold">Return to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
