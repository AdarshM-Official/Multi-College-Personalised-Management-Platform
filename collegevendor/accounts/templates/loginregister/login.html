<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Portal | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --brand: #4f46e5; /* Indigo 600 */
            --brand-light: #818cf8;
            --brand-dark: #3730a3;
            --bg-canvas: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --white: #ffffff;
            --shadow-sm: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(at 0% 0%, hsla(231,100%,77%,0.15) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(231,100%,77%,0.1) 0, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 48px;
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.7);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: left;
            margin-bottom: 32px;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            background: var(--brand);
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: var(--white);
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Password Wrapper for Eye Icon */
        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            user-select: none;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            accent-color: var(--brand);
        }

        .forgot-password {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            color: var(--brand-dark);
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--brand);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:hover {
            background-color: var(--brand-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-text {
            margin-top: 32px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="auth-card">
            <div class="header">
                <div class="logo-mark">P</div>
                <h1>Sign in</h1>
                <p>Enter your credentials to access your account.</p>
            </div>

            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">Email or Username</label>
                    <input type="text" id="username" name="username" class="input-field" placeholder="e.g. alex@company.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePass()"><i class="bi bi-eye"></i></span>
                    </div>
                </div>

                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="{% url 'password_reset' %}" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">Continue</button>
            </form>

            <div class="footer-text">
                New here? <a href="{% url 'register' %}">Create an account</a>
            </div>
        </div>
    </div>

    <script>
        function togglePass() {
            const passInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password i');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                passInput.type = 'password';
                toggleIcon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>

</body>
</html>
